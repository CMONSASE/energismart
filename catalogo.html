<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - EnergiSmart</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Hoja de estilos propia -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

  <!-- Encabezado con Fondo Oscuro -->
  <header class="bg-dark text-white py-3 shadow-sm mb-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
      <h1 class="h3 mb-0 text-success fw-bold">EnergiSmart</h1>
      <nav class="menu-navegacion mt-2 mt-md-0">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html" class="active">Catálogo</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="container my-4">
    <div class="text-center mb-4">
      <h2 class="display-5 fw-bold text-success">Catálogo Eficiente</h2>
      <p class="text-secondary">Encuentra los mejores equipos para reducir tu factura de energía durante El Niño 2026.</p>
    </div>

    <!-- Buscador y Filtros -->
    <div class="row g-3 align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm">
      <div class="col-12 col-md-4">
        <input type="text" id="buscador" class="form-control" placeholder="Buscar equipo por nombre...">
      </div>
      <div class="col-12 col-md-8 d-flex flex-wrap gap-2 justify-content-md-end" id="contenedor-filtros">
        <button class="btn btn-success btn-filtro active" data-categoria="todas">Todas</button>
        <button class="btn btn-outline-success btn-filtro" data-categoria="Refrigeración">Refrigeración</button>
        <button class="btn btn-outline-success btn-filtro" data-categoria="Climatización">Climatización</button>
        <button class="btn btn-outline-success btn-filtro" data-categoria="Iluminación">Iluminación</button>
      </div>
    </div>

    <!-- Catálogo y Carrito -->
    <div class="row g-4">
      <!-- Grid de Productos -->
      <div class="col-12 col-lg-8">
        <div class="row row-cols-1 row-cols-md-2 g-4" id="contenedor-productos">
          <!-- Aquí cargan los productos desde JavaScript -->
        </div>
      </div>

      <!-- Carrito de Compras -->
      <div class="col-12 col-lg-4">
        <div class="card tarjeta-producto p-3 border-0 shadow-sm sticky-top" style="top: 20px;">
          <h3 class="h4 fw-bold text-success border-bottom pb-2">🛒 Tu Carrito</h3>
          
          <ul class="list-group list-group-flush my-3" id="lista-carrito">
            <li class="list-group-item text-muted text-center py-3">El carrito está vacío.</li>
          </ul>

          <div class="border-top pt-3">
            <p class="d-flex justify-content-between mb-1">
              <span>Total Compra:</span>
              <strong id="total-compra">$0</strong>
            </p>
            <p class="d-flex justify-content-between text-success mb-1">
              <span>Ahorro Estimado / mes:</span>
              <strong id="total-ahorro">$0</strong>
            </p>
            <p class="small text-muted mb-3" id="tiempo-amortizacion">
              Se paga solo en: <strong>0 meses</strong>
            </p>

            <button id="btn-vaciar" class="btn btn-outline-danger w-100 fw-bold" disabled>Vaciar Carrito</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Script de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>

  <!-- Script de la Tienda (Revisa la ruta del archivo) -->
  <script src="js/tienda.js"></script>
</body>
</html>
