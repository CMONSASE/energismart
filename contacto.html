<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnergiSmart - Contacto</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header id="main-header" class="p-3 mb-4 text-white">
    <div class="container d-flex justify-content-between align-items-center">
      <h1>EnergiSmart</h1>
      <nav class="menu-navegacion">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="mb-4">Formulario de Asesoría Energética</h2>
        
        <form class="card p-4 shadow-sm border-0">
          <!-- Campo 1 -->
          <div class="mb-3">
            <label for="nombre" class="form-label font-weight-bold">Nombre Completo:</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej: Laura Gómez" required>
          </div>
          
          <!-- Campo 2 -->
          <div class="mb-3">
            <label for="correo" class="form-label font-weight-bold">Correo Electrónico:</label>
            <input type="email" id="correo" class="form-control" placeholder="ejemplo@dominio.com" required>
          </div>
          
          <!-- Campo 3 -->
          <div class="mb-3">
            <label for="telefono" class="form-label font-weight-bold">Teléfono de Contacto:</label>
            <input type="tel" id="telefono" class="form-control" placeholder="300 123 4567" required>
          </div>
          
          <!-- Campo 4 -->
          <div class="mb-3">
            <label for="ciudad" class="form-label font-weight-bold">Ciudad o Municipio:</label>
            <input type="text" id="ciudad" class="form-control" placeholder="Ej: Medellín" required>
          </div>
          
          <!-- Campo 5 -->
          <div class="mb-3">
            <label for="mensaje" class="form-label font-weight-bold">Consulta o Mensaje:</label>
            <textarea id="mensaje" class="form-control" rows="4" placeholder="Escribe aquí los detalles sobre el ahorro de energía en tu hogar..." required></textarea>
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg w-100">Enviar Formulario</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 mt-5 border-top">
    <p class="text-muted mb-0">© 2026 EnergiSmart - Soluciones de Eficiencia Energética</p>
  </footer>

</body>
</html>
